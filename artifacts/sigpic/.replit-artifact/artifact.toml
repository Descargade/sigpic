kind = "web"
previewPath = "/"
title = "SIGPIC"
description = "Sistema Integral de Gestión Patrimonial de Informática, Comunicaciones y Seguridad. Aplicación web institucional para administrar el patrimonio de bienes de una institución: inventarios físicos, responsables, ubicaciones, movimientos y estados de bienes."
version = "1.0.0"
id = "artifacts/sigpic"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22695

[services.development]
run = "pnpm --filter @workspace/sigpic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sigpic", "run", "build" ]
serve = "static"
publicDir = "artifacts/sigpic/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22695"
BASE_PATH = "/"
